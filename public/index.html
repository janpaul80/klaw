<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KLAW</title>
    <meta name="description" content="KLAW is a local-first AI runtime for transparent coding agents.">
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101411;
        color: #f5f7f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(120deg, rgba(71, 148, 100, 0.18), transparent 34%),
          radial-gradient(circle at top right, rgba(231, 214, 139, 0.2), transparent 30%),
          #101411;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-items: center;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 56px;
        padding: 56px 0;
      }

      img {
        width: min(280px, 70vw);
        height: auto;
        display: block;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(52px, 8vw, 112px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 680px;
        margin: 0 0 28px;
        color: #cdd7c8;
        font-size: 20px;
        line-height: 1.55;
      }

      code {
        display: block;
        width: fit-content;
        max-width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(245, 247, 241, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        color: #e7d68b;
        overflow-wrap: anywhere;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      a {
        color: #f5f7f1;
        text-decoration: none;
        border-bottom: 1px solid rgba(245, 247, 241, 0.45);
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          gap: 32px;
          align-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="KLAW logo">
      <section>
        <h1>KLAW</h1>
        <p>A local-first AI runtime for transparent coding agents. Plan with a model, write real files, run real shell commands, and keep the whole loop visible in your terminal.</p>
        <code>npm install -g @phartmann80/klaw</code>
        <div class="links">
          <a href="https://www.npmjs.com/package/@phartmann80/klaw">npm</a>
          <a href="https://github.com/janpaul80/klaw">GitHub</a>
        </div>
      </section>
    </main>
  </body>
</html>
